# SSH config for Ansible to reach backend hosts through the load balancer
# via ProxyJump. This exists because OpenSSH's implicit ProxyCommand for a
# ProxyJump hop does NOT inherit the -i identity file from the outer command
# line -- it only tries default identities. Putting IdentityFile here, keyed
# by Host pattern, works because the spawned jump-hop SSH process re-reads
# this same file (via -F) and matches its own target host against these
# same patterns.
#
# NOTE: 172.27.62.135 is the load balancer's floating IP, hardcoded here.
# If `terraform apply` ever recreates the load balancer, this IP can change
# and this file must be updated manually. A future improvement could
# template this file automatically (similar to update-inventory.sh in the
# main cumulus-lab project), but that's out of scope for now.

Host 172.27.62.135
  User ubuntu
  IdentityFile ~/.cumulus-secrets/mykey.pem
  IdentitiesOnly yes
  StrictHostKeyChecking no
  UserKnownHostsFile /dev/null

Host 192.168.1.*
  User ubuntu
  IdentityFile ~/.cumulus-secrets/mykey.pem
  IdentitiesOnly yes
  StrictHostKeyChecking no
  UserKnownHostsFile /dev/null
  ProxyJump 172.27.62.135
